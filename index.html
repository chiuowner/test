<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 測試頁面</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,.2);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #0078ff;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 20px;
            color: #666;
        }

        button {
            background: #0078ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: .3s;
        }

        button:hover {
            background: #005ecb;
            transform: scale(1.05);
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            color: green;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>HTML 測試頁面</h1>

    <p>輸入你的名字：</p>

    <input type="text" id="name" placeholder="請輸入名字">

    <button onclick="sayHello()">
        點我測試 JavaScript
    </button>

    <div id="result"></div>
</div>

<script>
function sayHello() {
    const name = document.getElementById("name").value;

    if(name.trim() === ""){
        document.getElementById("result").innerHTML =
            "⚠️ 請先輸入名字！";
    } else {
        document.getElementById("result").innerHTML =
            "🎉 Hello, " + name + "！歡迎來到 HTML 測試頁面！";
    }
}
</script>

</body>
</html>
